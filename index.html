<html lang="fr">
<head>
<meta charset="UTF-8">

<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─── DATA ─────────────────────────────────────────────── */
const SKILLS = [
  { id:"initiation",   name:"Éveil du Loup",         sub:"Initiation à la survie",              icon:"🔥", hours:"4h",   optional:true,  desc:"Un excellent point de départ. Découvrez les bases de la survie et l'esprit de la meute.", req:[] },
  { id:"debutant",     name:"Rite des Bois",          sub:"Survie de base · 24h",                icon:"🐺", hours:"24h",  base:true,      desc:"Feu, abri, eau, orientation — une nuit en forêt. Donne accès à la Survie Intermédiaire.", req:[] },
  { id:"hivernale",    name:"Loup Arctique",           sub:"Survie hivernale · 24h",              icon:"❄️", hours:"24h",  base:true,      desc:"Conditions hivernales extrêmes. Abris de neige, feu dans le froid, gestion de l'hypothermie. Donne aussi accès à l'Intermédiaire.", req:[] },
  { id:"apothicaire",  name:"Apothicaire des Bois",   sub:"Cours complémentaire · 24h",          icon:"🌿", hours:"24h",  comp:true,      desc:"Plantes comestibles et médicinales de la forêt boréale. Aucun prérequis.", req:[] },
  { id:"soins",        name:"Soins Austères",          sub:"Cours complémentaire",                icon:"🩸", hours:"16h",  comp:true,      desc:"Premiers soins en milieu hostile. Stabilisation et traitement quand les secours ne viennent pas. Aucun prérequis.", req:[] },
  { id:"navigation",   name:"Navigation (Vrai Nord)", sub:"Complémentaire · requis S.E.R.E.",    icon:"🧭", hours:"12h",  comp:true, sere:true, desc:"Orientation par carte, boussole et astres. Aucun prérequis — mais OBLIGATOIRE pour accéder au S.E.R.E.", req:[] },
  { id:"camouflage",   name:"Loup Furtif",             sub:"Complémentaire · requis S.E.R.E.",    icon:"👁️", hours:"12h",  comp:true, sere:true, desc:"Techniques militaires de camouflage et déplacement furtif. Aucun prérequis — mais OBLIGATOIRE pour accéder au S.E.R.E.", req:[] },
  { id:"pistage",      name:"Pistage de Combat",       sub:"Cours complémentaire",                icon:"🐾", hours:"12h",  comp:true,      desc:"Traquer, lire les signes, interpréter les traces. Aucun prérequis.", req:[] },
  { id:"intermediaire",name:"Instinct du Loup",        sub:"Survie intermédiaire · 48h",          icon:"⚔️", hours:"48h",               desc:"Feu par friction, abri 100% naturel, corde de fibres naturelles, pièges, traitement de l'eau. Prérequis : Rite des Bois OU Loup Arctique.", req:["debutant"] },
  { id:"avance",       name:"Survie Avancée",          sub:"Alpha de la meute · 48h",             icon:"🐊", hours:"48h",               desc:"Survie prolongée en autonomie complète. Prérequis : Instinct du Loup.", req:["intermediaire"] },
  { id:"sere",         name:"S.E.R.E.",                sub:"Survie Évasion Résistance · 72h",     icon:"🎖️", hours:"72h",               desc:"Programme d'élite militaire. Prérequis : Survie Avancée + Navigation (Vrai Nord) + Loup Furtif.", req:["avance","navigation","camouflage"] },
  { id:"Ulfhednar",    name:"Défi Ulfhednar",          sub:"La voie du Valhalla",                 icon:"🪓", hours:"???", legend:true,   desc:"Le défi ultime. Seuls ceux qui ont maîtrisé chaque discipline peuvent s'avancer.", req:["sere"] },
];

/* ─── POSITIONS (desktop: 1280×860) ────────────────────── */
const POS = {
  initiation:   { x: 100, y: 430 },
  debutant:     { x: 280, y: 320 },
  hivernale:    { x: 280, y: 540 },
  apothicaire:  { x: 500, y: 130 },
  soins:        { x: 500, y: 270 },
  navigation:   { x: 500, y: 410 },
  camouflage:   { x: 500, y: 550 },
  pistage:      { x: 500, y: 690 },
  intermediaire:{ x: 700, y: 430 },
  avance:       { x: 870, y: 430 },
  sere:         { x: 1040, y: 430 },
  Ulfhednar:    { x: 1200, y: 430 },
};

/* ─── CONNECTIONS ───────────────────────────────────────── */
const CONNECTIONS = [
  { from:"initiation",   to:"debutant",      type:"main" },
  { from:"initiation",   to:"hivernale",     type:"main" },
  { from:"debutant",     to:"intermediaire", type:"or"   },
  { from:"hivernale",    to:"intermediaire", type:"or"   },
  { from:"intermediaire",to:"avance",        type:"main" },
  { from:"avance",       to:"sere",          type:"main" },
  { from:"navigation",   to:"sere",          type:"sere" },
  { from:"camouflage",   to:"sere",          type:"sere" },
  { from:"sere",         to:"Ulfhednar",     type:"gold" },
];

/* ─── HELPERS ───────────────────────────────────────────── */
function isAvailable(id, completed) {
  const s = SKILLS.find(x => x.id === id);
  if (!s) return false;
  if (id === "intermediaire") return completed.has("debutant") || completed.has("hivernale");
  return s.req.every(r => completed.has(r));
}

function getDescendants(id, completed) {
  // find all completed skills that depend on this one
  const toRemove = new Set([id]);
  let changed = true;
  while (changed) {
    changed = false;
    SKILLS.forEach(s => {
      if (toRemove.has(s.id)) return;
      const deps = s.req.filter(r => toRemove.has(r));
      if (deps.length === 0) return;
      // special: intermediaire needs debutant OR hivernale
      if (s.id === "intermediaire") {
        const remaining = s.req.filter(r => completed.has(r) && !toRemove.has(r));
        if (remaining.length > 0) return; // still has another base
        // actually intermediaire requires debutant OR hivernale
        const hasDebutant = completed.has("debutant") && !toRemove.has("debutant");
        const hasHivernale = completed.has("hivernale") && !toRemove.has("hivernale");
        if (!hasDebutant && !hasHivernale) { toRemove.add(s.id); changed = true; }
      } else {
        toRemove.add(s.id); changed = true;
      }
    });
  }
  return toRemove;
}

/* ─── COLORS ────────────────────────────────────────────── */
const C = {
  main:  "#c23a22",
  comp:  "#4a7c35",
  sereC: "#3a6aaa",
  gold:  "#c8960a",
  base:  "#c23a22",
};

function nodeColor(skill, active) {
  if (skill.legend) return active ? "#c8960a" : "#554400";
  if (skill.sere)   return active ? C.sereC : "#223355";
  if (skill.comp)   return active ? C.comp  : "#223311";
  return active ? C.main : "#551100";
}

/* ─── TOOLTIP ───────────────────────────────────────────── */
function Tooltip({ skill, completed, onToggle, onClose, isMobile }) {
  if (!skill) return null;
  const active  = completed.has(skill.id);
  const avail   = isAvailable(skill.id, completed);
  const accent  = skill.legend ? C.gold : skill.sere ? C.sereC : skill.comp ? C.comp : C.main;
  const missing = skill.req.filter(r => !completed.has(r)).map(r => SKILLS.find(s=>s.id===r)?.name).filter(Boolean);

  const style = isMobile ? {
    position:"fixed", bottom:0, left:0, right:0, zIndex:9999,
    background:"#111", borderTop:`2px solid ${accent}`,
    padding:"20px 20px 32px", borderRadius:"12px 12px 0 0",
  } : {
    position:"fixed", top:"50%", left:"50%", transform:"translate(-50%,-50%)",
    zIndex:9999, background:"#141414", border:`1px solid ${accent}55`,
    borderRadius:12, padding:"24px 28px", width:360, maxWidth:"90vw",
    boxShadow:`0 20px 60px #000c, 0 0 40px ${accent}15`,
  };

  return (
    <>
      <div onClick={onClose} style={{ position:"fixed",inset:0,background:"#000a",zIndex:9998 }} />
      <div style={style}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12 }}>
          <span style={{ fontSize:28 }}>{skill.icon}</span>
          <div>
            <div style={{ fontWeight:800, fontSize:15, color:"#e8d5c4", letterSpacing:0.5 }}>{skill.name}</div>
            <div style={{ fontSize:11, color:accent, fontStyle:"italic", marginTop:2 }}>{skill.sub}</div>
          </div>
          <button onClick={onClose} style={{ marginLeft:"auto", background:"none", border:"none", color:"#666", fontSize:20, cursor:"pointer", lineHeight:1 }}>✕</button>
        </div>
        <p style={{ fontSize:13, color:"#999", lineHeight:1.6, marginBottom:14 }}>{skill.desc}</p>
        {skill.req.length > 0 && (
          <div style={{ fontSize:12, color:"#666", marginBottom:10 }}>
            🔗 Prérequis : {skill.req.map((r,i) => {
              const s = SKILLS.find(x=>x.id===r);
              return <span key={r} style={{ color: completed.has(r) ? "#5a5" : "#a44" }}>{s?.name}{i<skill.req.length-1?" · ":""}</span>;
            })}
          </div>
        )}
        {missing.length > 0 && (
          <div style={{ fontSize:11, color:"#a44", padding:"8px 10px", background:"#1a0808", borderRadius:6, border:"1px solid #331111", marginBottom:12 }}>
            ⚠️ Manquants : {missing.join(", ")}
          </div>
        )}
        <button
          onClick={() => { if (active || avail) { onToggle(skill.id); onClose(); } }}
          style={{ width:"100%", padding:"12px", borderRadius:8, fontSize:13, fontWeight:800, letterSpacing:1.5,
            textTransform:"uppercase", cursor: (active||avail)?"pointer":"not-allowed",
            background: active ? "#222" : avail ? accent : "#1a1a1a",
            color: active ? accent : avail ? "#fff" : "#555",
            border: `1px solid ${active||avail ? accent : "#333"}` }}>
          {active ? "✓ Complété — Retirer" : avail ? "Marquer comme complété" : "🔒 Prérequis manquants"}
        </button>
      </div>
    </>
  );
}

/* ─── SVG NODE ──────────────────────────────────────────── */
function Node({ skill, pos, completed, onSelect }) {
  const active = completed.has(skill.id);
  const avail  = isAvailable(skill.id, completed);
  const r      = skill.comp ? 32 : skill.legend ? 50 : 42;
  const accent = skill.legend ? C.gold : skill.sere ? C.sereC : skill.comp ? C.comp : C.main;
  const fill   = active ? (skill.legend ? "#1a1200" : skill.comp ? "#0c1a06" : "#1a0a06") : "#111";
  const stroke = active ? accent : avail ? (skill.comp ? "#334422" : "#444") : "#252525";
  const opacity= (active || avail) ? 1 : 0.45;
  const dash   = skill.comp && !active ? "5,3" : "none";

  return (
    <g onClick={() => onSelect(skill)} style={{ cursor:"pointer", opacity }}>
      {active && (
        <circle cx={pos.x} cy={pos.y} r={r+10} fill="none" stroke={accent} strokeWidth="1.5" opacity="0.25">
          <animate attributeName="r" values={`${r+7};${r+14};${r+7}`} dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.3;0.08;0.3" dur="2.5s" repeatCount="indefinite"/>
        </circle>
      )}
      <circle cx={pos.x} cy={pos.y} r={r} fill={fill} stroke={stroke} strokeWidth={active?2.5:1.5} strokeDasharray={dash}/>
      <circle cx={pos.x} cy={pos.y} r={r-7} fill="none" stroke={active?accent:"#2a2a2a"} strokeWidth="1" strokeDasharray="3,3" opacity={active?0.5:0.25}/>
      <text x={pos.x} y={pos.y+1} textAnchor="middle" dominantBaseline="central" fontSize={skill.comp?16:skill.legend?24:20}>
        {skill.icon}
      </text>
      <text x={pos.x} y={pos.y+r+14} textAnchor="middle" fontSize={skill.comp?9:11} fontWeight="700"
        fill={active?accent:avail?"#bbb":"#555"} fontFamily="'Trebuchet MS',sans-serif" letterSpacing="0.3">
        {skill.name.toUpperCase()}
      </text>
      <text x={pos.x} y={pos.y+r+26} textAnchor="middle" fontSize={8} fill={active?accent:"#555"}
        fontStyle="italic" fontFamily="Georgia,serif">
        {skill.sub}
      </text>
      {skill.optional && (
        <>
          <rect x={pos.x-24} y={pos.y-r-18} width={48} height={13} rx={6} fill="none" stroke="#555" strokeWidth="1"/>
          <text x={pos.x} y={pos.y-r-8} textAnchor="middle" fontSize="7" fill="#777" fontFamily="monospace">OPTIONNEL</text>
        </>
      )}
      {skill.comp && !active && (
        <>
          <rect x={pos.x-28} y={pos.y-r-18} width={56} height={13} rx={6}
            fill="none" stroke={skill.sere?C.sereC+"55":C.comp+"44"} strokeWidth="1"/>
          <text x={pos.x} y={pos.y-r-8} textAnchor="middle" fontSize="7"
            fill={skill.sere?C.sereC:C.comp} fontFamily="monospace">
            {skill.sere?"REQ. S.E.R.E.":"COMPLÉMENTAIRE"}
          </text>
        </>
      )}
      {skill.legend && !active && (
        <>
          <rect x={pos.x-18} y={pos.y-r-18} width={36} height={13} rx={6}
            fill={avail?C.gold:"none"} stroke={avail?C.gold:"#665500"} strokeWidth="1"/>
          <text x={pos.x} y={pos.y-r-8} textAnchor="middle" fontSize="7"
            fill={avail?"#000":"#886600"} fontWeight="800" fontFamily="monospace">DÉFI</text>
        </>
      )}
      {active && (
        <g>
          <circle cx={pos.x-r+6} cy={pos.y-r+6} r="9" fill={accent}/>
          <text x={pos.x-r+6} y={pos.y-r+7} textAnchor="middle" dominantBaseline="central"
            fill={skill.legend?"#000":"#fff"} fontSize="11" fontWeight="bold">✓</text>
        </g>
      )}
      {!active && !avail && (
        <text x={pos.x+r-8} y={pos.y-r+8} fontSize="13" opacity="0.5">🔒</text>
      )}
    </g>
  );
}

/* ─── CONNECTION LINE ───────────────────────────────────── */
function ConnLine({ conn, completed }) {
  const from = POS[conn.from];
  const to   = POS[conn.to];
  if (!from || !to) return null;
  const active = completed.has(conn.from) && completed.has(conn.to);
  const avail  = completed.has(conn.from);
  const color  = conn.type==="gold" ? C.gold : conn.type==="sere" ? C.sereC : C.main;
  const rFrom  = SKILLS.find(s=>s.id===conn.from)?.comp ? 32 : SKILLS.find(s=>s.id===conn.from)?.legend ? 50 : 42;
  const rTo    = SKILLS.find(s=>s.id===conn.to)?.comp ? 32 : SKILLS.find(s=>s.id===conn.to)?.legend ? 50 : 42;

  // Simple straight line with offset for node radius
  const dx = to.x - from.x, dy = to.y - from.y;
  const len = Math.sqrt(dx*dx + dy*dy);
  const ux = dx/len, uy = dy/len;
  const x1 = from.x + ux*rFrom, y1 = from.y + uy*rFrom;
  const x2 = to.x   - ux*rTo,   y2 = to.y   - uy*rTo;
  const midX = (x1+x2)/2, midY = (y1+y2)/2 - (conn.type==="main"||conn.type==="or" ? 0 : 20);

  return (
    <path
      d={`M${x1},${y1} Q${midX},${midY} ${x2},${y2}`}
      fill="none"
      stroke={active ? color : avail ? color+"55" : "#252525"}
      strokeWidth={active ? 2 : 1.5}
      strokeDasharray={conn.type==="or" ? "7,4" : conn.type==="sere" ? "5,4" : active ? "none" : "6,4"}
      opacity={active ? 0.9 : avail ? 0.4 : 0.15}
    />
  );
}

/* ─── OR LABEL ──────────────────────────────────────────── */
function OrLabel({ completed }) {
  // midpoint between debutant->intermediaire and hivernale->intermediaire lines
  const mx = (POS.debutant.x + POS.intermediaire.x) / 2;
  const my = (POS.debutant.y + POS.intermediaire.y) / 2 + 30;
  const active = completed.has("debutant") || completed.has("hivernale");
  return (
    <text x={mx} y={my} textAnchor="middle" fontSize="10" fill={active?"#c23a2288":"#444"}
      fontStyle="italic" fontFamily="monospace">OU</text>
  );
}

/* ─── MOBILE CARD ───────────────────────────────────────── */
function MobileCard({ skill, completed, onSelect }) {
  const active = completed.has(skill.id);
  const avail  = isAvailable(skill.id, completed);
  const accent = skill.legend ? C.gold : skill.sere ? C.sereC : skill.comp ? C.comp : C.main;
  return (
    <div onClick={() => onSelect(skill)}
      style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:4,
        opacity: (active||avail) ? 1 : 0.4, cursor:"pointer" }}>
      <div style={{ width:52, height:52, borderRadius: skill.legend?"10px":"50%",
        background: active ? (skill.comp?"#0c1a06":skill.legend?"#1a1200":"#1a0a06") : "#141414",
        border:`${active?2.5:1.5}px ${skill.comp&&!active?"dashed":"solid"} ${active?accent:avail?(skill.comp?C.comp+"88":"#444"):"#282828"}`,
        display:"flex", alignItems:"center", justifyContent:"center", position:"relative",
        boxShadow: active ? `0 0 16px ${accent}55` : "none" }}>
        <span style={{ fontSize:22 }}>{skill.icon}</span>
        {active && <div style={{ position:"absolute",top:-4,right:-4,width:16,height:16,borderRadius:"50%",background:accent,display:"flex",alignItems:"center",justifyContent:"center" }}>
          <span style={{ color:skill.legend?"#000":"#fff", fontSize:9, fontWeight:"bold" }}>✓</span>
        </div>}
        {!active && !avail && <div style={{ position:"absolute",bottom:-2,right:-2,fontSize:10,opacity:0.6 }}>🔒</div>}
      </div>
      <span style={{ fontSize:8, fontWeight:700, textTransform:"uppercase", textAlign:"center",
        lineHeight:1.2, maxWidth:72, color: active?accent:avail?"#bbb":"#555" }}>
        {skill.name}
      </span>
      {skill.comp && <span style={{ fontSize:7, color: skill.sere?C.sereC:C.comp, fontFamily:"monospace" }}>
        {skill.sere?"REQ.SERE":"COMP."}
      </span>}
    </div>
  );
}

/* ─── MAIN ──────────────────────────────────────────────── */
function App() {
  const [completed, setCompleted] = useState(new Set());
  const [tooltip, setTooltip]     = useState(null);
  const [W, setW]                 = useState(window.innerWidth);
  const isMobile = W < 768;

  useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);

  function toggle(id) {
    setCompleted(prev => {
      const next = new Set(prev);
      if (next.has(id)) {
        // remove this and all that depended on it
        const toRemove = getDescendants(id, next);
        toRemove.forEach(x => next.delete(x));
      } else if (isAvailable(id, next)) {
        next.add(id);
      }
      return next;
    });
  }

  const svgW = Math.max(W, 1280);
  const svgH = 860;
  // Scale positions if window is smaller
  const scaleX = Math.min(1, (W - 20) / 1280);

  function scaledPos(id) {
    const p = POS[id];
    return { x: p.x * scaleX + (W < 1280 ? 10 : 0), y: p.y };
  }
  const sPos = {};
  Object.keys(POS).forEach(id => { sPos[id] = scaledPos(id); });

  if (isMobile) {
    const mainSkills = SKILLS.filter(s => !s.comp);
    const compSkills = SKILLS.filter(s => s.comp);
    return (
      <div style={{ background:"#0a0a0a", minHeight:"100vh", color:"#e8d5c4", fontFamily:"'Trebuchet MS',sans-serif", paddingBottom:40 }}>
        {/* Header */}
        <div style={{ padding:"16px 16px 8px", borderBottom:"1px solid #1a1a1a" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <span style={{ fontSize:22 }}>🐺</span>
            <div>
              <div style={{ fontWeight:900, letterSpacing:2, fontSize:13, textTransform:"uppercase" }}>Black Wolf Survival</div>
              <div style={{ fontSize:9, color:C.main, letterSpacing:1.5, textTransform:"uppercase" }}>Arbre de progression</div>
            </div>
          </div>
        </div>
        <div style={{ padding:"12px 16px" }}>
          {/* Éveil */}
          <div style={{ fontSize:9, color:"#555", textTransform:"uppercase", letterSpacing:2, textAlign:"center", marginBottom:8 }}>Éveil</div>
          <div style={{ display:"flex", justifyContent:"center", marginBottom:4 }}>
            <MobileCard skill={SKILLS.find(s=>s.id==="initiation")} completed={completed} onSelect={setTooltip}/>
          </div>
          <div style={{ display:"flex", justifyContent:"center", marginBottom:8 }}>
            <svg width="20" height="24"><line x1="10" y1="0" x2="10" y2="18" stroke="#333" strokeWidth="1.5" strokeDasharray="4,3"/><polygon points="4,16 10,22 16,16" fill="#333"/></svg>
          </div>
          {/* Base */}
          <div style={{ fontSize:9, color:"#555", textTransform:"uppercase", letterSpacing:2, textAlign:"center", marginBottom:4 }}>Base · choisir l'un ou les deux</div>
          <div style={{ display:"flex", justifyContent:"center", gap:32, marginBottom:8 }}>
            <MobileCard skill={SKILLS.find(s=>s.id==="debutant")} completed={completed} onSelect={setTooltip}/>
            <MobileCard skill={SKILLS.find(s=>s.id==="hivernale")} completed={completed} onSelect={setTooltip}/>
          </div>
          {/* Complémentaires */}
          <div style={{ background:"#0f1a0a", border:"1px solid #223311", borderRadius:10, padding:"10px 12px", marginBottom:8 }}>
            <div style={{ fontSize:9, color:C.comp, textTransform:"uppercase", letterSpacing:2, textAlign:"center", marginBottom:10 }}>
              Cours complémentaires · aucun prérequis
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, justifyItems:"center" }}>
              {compSkills.map(s => <MobileCard key={s.id} skill={s} completed={completed} onSelect={setTooltip}/>)}
            </div>
          </div>
          {/* Arrow to intermédiaire */}
          <div style={{ display:"flex", justifyContent:"center", marginBottom:4 }}>
            <svg width="20" height="24"><line x1="10" y1="0" x2="10" y2="18" stroke={completed.has("debutant")||completed.has("hivernale")?C.main:"#333"} strokeWidth="1.5"/><polygon points="4,16 10,22 16,16" fill={completed.has("debutant")||completed.has("hivernale")?C.main:"#333"}/></svg>
          </div>
          {/* Progression */}
          {["intermediaire","avance","sere","Ulfhednar"].map((id,i) => {
            const s = SKILLS.find(x=>x.id===id);
            const accent = id==="Ulfhednar"?C.gold:C.main;
            return (
              <React.Fragment key={id}>
                <div style={{ fontSize:9, color:"#555", textTransform:"uppercase", letterSpacing:2, textAlign:"center", marginBottom:4 }}>
                  {id==="intermediaire"?"Intermédiaire":id==="avance"?"Avancé":id==="sere"?"Élite":"Légende"}
                  {id==="sere"?" · + Navigation + Loup Furtif":""}
                </div>
                <div style={{ display:"flex", justifyContent:"center", marginBottom:4 }}>
                  <MobileCard skill={s} completed={completed} onSelect={setTooltip}/>
                </div>
                {id!=="Ulfhednar" && <div style={{ display:"flex", justifyContent:"center", marginBottom:4 }}>
                  <svg width="20" height="24"><line x1="10" y1="0" x2="10" y2="18" stroke={completed.has(id)?accent:"#333"} strokeWidth="1.5"/><polygon points="4,16 10,22 16,16" fill={completed.has(id)?accent:"#333"}/></svg>
                </div>}
              </React.Fragment>
            );
          })}
        </div>
        {tooltip && <Tooltip skill={tooltip} completed={completed} onToggle={toggle} onClose={()=>setTooltip(null)} isMobile={true}/>}
      </div>
    );
  }

  return (
    <div style={{ background:"linear-gradient(145deg,#0a0a0a 0%,#0e0e0e 50%,#0d0808 100%)", minHeight:"100vh", fontFamily:"'Trebuchet MS',sans-serif", color:"#e8d5c4", overflow:"hidden" }}>
      {/* Header */}
      <div style={{ padding:"20px 32px 0", position:"relative", zIndex:2 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <span style={{ fontSize:28 }}>🐺</span>
          <div>
            <h1 style={{ fontSize:22, fontWeight:900, letterSpacing:4, margin:0, textTransform:"uppercase" }}>Black Wolf Survival</h1>
            <p style={{ fontSize:11, letterSpacing:3, color:C.main, margin:"3px 0 0", textTransform:"uppercase", fontWeight:700 }}>Arbre de progression</p>
          </div>
        </div>
        <div style={{ marginTop:8, display:"flex", gap:20, flexWrap:"wrap" }}>
          <span style={{ fontSize:10, color:C.comp, fontFamily:"monospace" }}>◌ - - Complémentaire (aucun prérequis)</span>
          <span style={{ fontSize:10, color:C.sereC, fontFamily:"monospace" }}>- - Navigation + Loup Furtif requis pour S.E.R.E.</span>
          <span style={{ fontSize:10, color:C.main, fontFamily:"monospace" }}>- - Rite des Bois OU Loup Arctique → Intermédiaire</span>
        </div>
      </div>

      {/* SVG */}
      <div style={{ overflowX:"auto", overflowY:"visible" }}>
        <svg width={W} height={svgH} style={{ display:"block" }} viewBox={`0 0 ${W} ${svgH}`}>
          {/* connections */}
          {CONNECTIONS.map((conn,i) => {
            const from = sPos[conn.from];
            const to   = sPos[conn.to];
            if (!from || !to) return null;
            const active = completed.has(conn.from) && completed.has(conn.to);
            const avail  = completed.has(conn.from);
            const color  = conn.type==="gold"?C.gold:conn.type==="sere"?C.sereC:C.main;
            const sfrom  = SKILLS.find(s=>s.id===conn.from);
            const sto    = SKILLS.find(s=>s.id===conn.to);
            const rF = sfrom?.comp?32:sfrom?.legend?50:42;
            const rT = sto?.comp?32:sto?.legend?50:42;
            const dx = to.x-from.x, dy = to.y-from.y;
            const len = Math.sqrt(dx*dx+dy*dy);
            const ux = dx/len, uy = dy/len;
            const x1=from.x+ux*rF, y1=from.y+uy*rF;
            const x2=to.x-ux*rT,   y2=to.y-uy*rT;
            const bend = conn.type==="sere" ? -30 : 0;
            const midX=(x1+x2)/2, midY=(y1+y2)/2+bend;
            return (
              <path key={i}
                d={`M${x1},${y1} Q${midX},${midY} ${x2},${y2}`}
                fill="none"
                stroke={active?color:avail?color+"66":"#252525"}
                strokeWidth={active?2.5:1.5}
                strokeDasharray={conn.type==="or"?"8,5":conn.type==="sere"?"5,4":active?"none":"6,4"}
                opacity={active?0.9:avail?0.45:0.15}
              />
            );
          })}
          {/* OR label */}
          <text x={(sPos.debutant.x+sPos.intermediaire.x)/2}
                y={(sPos.debutant.y+sPos.hivernale.y)/2}
                textAnchor="middle" fontSize="11" fill={completed.has("debutant")||completed.has("hivernale")?C.main+"88":"#3a3a3a"}
                fontStyle="italic" fontFamily="monospace">OU</text>
          {/* comp zone background */}
          <rect x={sPos.apothicaire.x-50} y={sPos.apothicaire.y-50}
                width={100} height={(sPos.pistage.y-sPos.apothicaire.y)+100}
                rx={14} fill="#0f1a0a" stroke="#223311" strokeWidth="1" strokeDasharray="4,4" opacity="0.6"/>
          <text x={sPos.apothicaire.x} y={sPos.apothicaire.y-62}
                textAnchor="middle" fontSize="9" fill={C.comp+"aa"} fontFamily="monospace" letterSpacing="1">
            COMPLÉMENTAIRES
          </text>
          {/* nodes */}
          {SKILLS.map(skill => (
            <Node key={skill.id} skill={skill} pos={sPos[skill.id]}
              completed={completed} onSelect={setTooltip}/>
          ))}
        </svg>
      </div>

      <div style={{ textAlign:"center", padding:"4px 0 16px", fontSize:11, color:"#444", letterSpacing:2, textTransform:"uppercase" }}>
        Cliquer sur un cours pour voir les détails et marquer la progression
      </div>

      {tooltip && <Tooltip skill={tooltip} completed={completed} onToggle={toggle} onClose={()=>setTooltip(null)} isMobile={false}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
(function(){
  function rh(){ window.parent.postMessage({type:"resize",height:document.documentElement.scrollHeight},"*"); }
  window.addEventListener("load",rh);
  window.addEventListener("resize",rh);
  new MutationObserver(()=>setTimeout(rh,100)).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body>
</html>
